# The free Supabase plan pauses a project after a week without requests.
# This pings the sync server every 3 days so phone ⇄ laptop sync keeps working during holidays.
# If the server is paused or unreachable, this run fails and GitHub emails you.
name: Keep sync server awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          body=$(curl -s -m 30 -X POST \
            "https://ajrajlytkhgndcyfgwnb.supabase.co/rest/v1/rpc/sync_ping" \
            -H "apikey: sb_publishable_w_xML4WEJsHUMY6WBNjSqQ_jT4DKVov" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "$body"
          # "ok" means the database answered
          test "$body" = '"ok"'
