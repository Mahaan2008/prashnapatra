# The free Supabase plan pauses a project after a week without requests.
# This pings the sync server every 3 days so phone ⇄ laptop sync keeps working during holidays.
name: Keep sync server awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://ujvepmswpraqbpsnwmtl.supabase.co/rest/v1/rpc/sync_status" \
            -H "apikey: sb_publishable_aY78IsFJNOFTB1zbwlwA7Q_3pPgZrJj" \
            -H "Content-Type: application/json" \
            -d '{"p_key":"keep-awake-ping-keep-awake-ping-00"}')
          echo "HTTP $code (404 'unknown sync key' is the expected answer)"
          test "$code" = "404" -o "$code" = "400" -o "$code" = "200"
